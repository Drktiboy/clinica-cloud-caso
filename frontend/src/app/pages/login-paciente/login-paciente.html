<div class="min-h-screen flex items-center justify-center bg-dark-bg p-4 relative overflow-hidden">
    <!-- Círculos decorativos de fondo para el efecto glassmorphism -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-cyan-accent/20 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-cyan-accent/10 rounded-full blur-[100px]"></div>
  
    <!-- Tarjeta de Login (Efecto Cristal) -->
    <div class="max-w-md w-full bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-8 shadow-2xl relative z-10">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-white mb-2">Portal de <span class="text-cyan-accent">Pacientes</span></h1>
        <p class="text-gray-400">Accede a tus citas y notificaciones SaaS</p>
      </div>
      
      <form class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">CURP (Usuario)</label>
          <input type="text" class="w-full bg-dark-panel border border-gray-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-cyan-accent focus:ring-1 focus:ring-cyan-accent transition-colors" placeholder="Ingresa tu CURP">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Contraseña</label>
          <input type="password" class="w-full bg-dark-panel border border-gray-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-cyan-accent focus:ring-1 focus:ring-cyan-accent transition-colors" placeholder="••••••••">
        </div>
        <button type="button" class="w-full bg-cyan-accent text-dark-bg font-bold rounded-lg px-4 py-3 hover:bg-cyan-400 transition-colors shadow-[0_0_15px_rgba(0,229,255,0.4)]">
          Ingresar al Portal
        </button>
        
        <div class="text-center mt-4">
          <a href="/admin" class="text-sm text-gray-400 hover:text-cyan-accent transition-colors">¿Eres personal médico? Accede aquí</a>
        </div>
      </form>
    </div>
  </div>
