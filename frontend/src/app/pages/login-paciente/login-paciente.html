<div class="min-h-screen flex items-center justify-center bg-dark-bg p-4 relative overflow-hidden">
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-cyan-accent/15 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-600/15 rounded-full blur-[120px]"></div>
  
    <div class="max-w-md w-full bg-dark-panel/90 backdrop-blur-md border border-gray-800 rounded-2xl p-8 shadow-2xl relative z-10">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-bold text-white mb-1">Portal de <span class="text-cyan-accent">Pacientes</span></h1>
        <p class="text-sm text-gray-400">Accede a tus citas y notificaciones SaaS</p>
      </div>
  
      <!-- PESTAÑAS INGRESAR / CREAR CUENTA -->
      <div class="grid grid-cols-2 bg-[#0f172a] p-1 rounded-xl mb-6 border border-gray-800">
        <button type="button" (click)="alternarModo(false)"
                [ngClass]="!modoRegistro ? 'bg-cyan-accent text-dark-bg font-bold shadow' : 'text-gray-400 hover:text-white'"
                class="py-2 rounded-lg text-sm transition-all">
          Ingresar
        </button>
        <button type="button" (click)="alternarModo(true)"
                [ngClass]="modoRegistro ? 'bg-cyan-accent text-dark-bg font-bold shadow' : 'text-gray-400 hover:text-white'"
                class="py-2 rounded-lg text-sm transition-all">
          Crear Cuenta
        </button>
      </div>
  
      <!-- FORMULARIO DE INICIO DE SESIÓN -->
      <form *ngIf="!modoRegistro" (ngSubmit)="onLogin()" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">CURP (Usuario)</label>
          <input type="text" [(ngModel)]="curpLogin" name="curpLogin" placeholder="Ej. LOSM060520HMCPNCA0"
                 class="w-full bg-[#0f172a] border border-gray-700 rounded-lg px-4 py-3 text-white uppercase focus:outline-none focus:border-cyan-accent transition-colors">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Contraseña</label>
          <input type="password" [(ngModel)]="passwordLogin" name="passwordLogin" placeholder="••••••••••"
                 class="w-full bg-[#0f172a] border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-cyan-accent transition-colors">
        </div>
        <button type="submit" [disabled]="cargando"
                class="w-full bg-cyan-accent text-dark-bg font-bold rounded-lg px-4 py-3 hover:bg-cyan-400 transition-all shadow-[0_0_20px_rgba(0,229,255,0.25)] disabled:opacity-50">
          {{ cargando ? 'Conectando...' : 'Ingresar al Portal' }}
        </button>
      </form>
  
      <!-- FORMULARIO DE REGISTRO -->
      <form *ngIf="modoRegistro" (ngSubmit)="onRegister()" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">Nombre Completo</label>
          <input type="text" [(ngModel)]="registro.nombre_completo" name="nombre" placeholder="Ej. Michael López Sánchez"
                 class="w-full bg-[#0f172a] border border-gray-700 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-cyan-accent">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">CURP</label>
          <input type="text" [(ngModel)]="registro.curp" name="curpReg" placeholder="18 caracteres"
                 class="w-full bg-[#0f172a] border border-gray-700 rounded-lg px-4 py-2.5 text-white text-sm uppercase focus:outline-none focus:border-cyan-accent">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-300 mb-1">Teléfono</label>
            <input type="text" [(ngModel)]="registro.telefono" name="telefono" placeholder="7221234567"
                   class="w-full bg-[#0f172a] border border-gray-700 rounded-lg px-3 py-2.5 text-white text-sm focus:outline-none focus:border-cyan-accent">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-300 mb-1">Correo Gmail</label>
            <input type="email" [(ngModel)]="registro.email" name="email" placeholder="correo@gmail.com"
                   class="w-full bg-[#0f172a] border border-gray-700 rounded-lg px-3 py-2.5 text-white text-sm focus:outline-none focus:border-cyan-accent">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">Crea una Contraseña</label>
          <input type="password" [(ngModel)]="registro.password" name="passReg" placeholder="••••••••"
                 class="w-full bg-[#0f172a] border border-gray-700 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-cyan-accent">
        </div>
        <button type="submit" [disabled]="cargando"
                class="w-full bg-cyan-accent text-dark-bg font-bold rounded-lg px-4 py-3 hover:bg-cyan-400 transition-all shadow-[0_0_20px_rgba(0,229,255,0.25)] disabled:opacity-50">
          {{ cargando ? 'Creando cuenta...' : 'Crear Cuenta' }}
        </button>
      </form>
    </div>
  
    <!-- ACCESO DISCRETO / ESCONDIDO PARA ADMINISTRACIÓN -->
    <a routerLink="/admin" title="Acceso administrativo"
       class="fixed bottom-4 right-4 text-gray-600 opacity-20 hover:opacity-90 hover:text-cyan-accent transition-opacity p-2 rounded-full">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
      </svg>
    </a>
  </div>
